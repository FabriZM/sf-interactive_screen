<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Teléfono</title>
<link rel="stylesheet" href="/call.css">
</head>
<body data-status="idle">

<!-- The blurred contact photo behind everything, the way iOS backs a call. -->
<div id="wall" class="wall"></div>

<!-- Fake iOS status bar. Hidden when the page runs from the home screen
     without fullscreen, because there the system draws its own over it. -->
<div id="sb" class="sb">
  <span id="sb-time">—</span>
  <span class="sb-right">
    <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
    <svg class="sb-wifi" viewBox="0 0 17 12" aria-hidden="true">
      <path d="M8.5 10.9 6.2 8.4a3.4 3.4 0 0 1 4.6 0zM3.9 6.1a7 7 0 0 1 9.2 0l1.5-1.6a9.2 9.2 0 0 0-12.2 0z"/>
    </svg>
    <span class="sb-batt"><i id="sb-batt-fill"></i></span>
  </span>
</div>

<!-- llamada entrante ----------------------------------------------------- -->
<section id="incoming" class="scr">
  <div class="who">
    <div class="avatar big"><span class="mono"></span><img alt=""></div>
    <div class="name"></div>
    <div class="sub"></div>
  </div>
  <div class="answer-row">
    <div class="act">
      <button id="decline" class="rnd red" aria-label="Rechazar">
        <svg class="handset down" viewBox="0 0 24 24" aria-hidden="true"><use href="#hs"/></svg>
      </button>
      <span>Rechazar</span>
    </div>
    <div class="act">
      <button id="answer" class="rnd green" aria-label="Aceptar">
        <svg class="handset" viewBox="0 0 24 24" aria-hidden="true"><use href="#hs"/></svg>
      </button>
      <span>Aceptar</span>
    </div>
  </div>
</section>

<!-- en llamada ----------------------------------------------------------- -->
<section id="oncall" class="scr">
  <div class="who small">
    <div class="avatar"><span class="mono"></span><img alt=""></div>
    <div class="name"></div>
    <div id="timer" class="timer">00:00</div>
  </div>
  <div id="pad" class="pad"></div>
  <div class="end-row">
    <button id="end" class="rnd red" aria-label="Colgar">
      <svg class="handset down" viewBox="0 0 24 24" aria-hidden="true"><use href="#hs"/></svg>
    </button>
  </div>
</section>

<!-- proximidad: la pantalla se apaga contra la oreja --------------------- -->
<div id="dark" class="dark"></div>

<!-- en reposo: negro. El aviso se va solo y no vuelve durante una toma --- -->
<div id="idle" class="idle">
  <div class="hint">
    <b>Teléfono listo</b>
    <span>La llamada se maneja desde el control.</span>
    <span class="tap">Tocá la pantalla una vez: pantalla completa y permiso
      para el tono.</span>
  </div>
</div>

<div id="dot" class="conn-dot"></div>

<!-- one handset, referenced by every button that needs it ---------------- -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="hs" d="M6.6 2.4c.63 0 1.2.38 1.44.96l1.5 3.5c.26.6.09 1.3-.4 1.72l-1.2 1.03c-.3.26-.4.68-.23 1.04a12.6 12.6 0 0 0 5.24 5.24c.36.18.78.07 1.04-.23l1.03-1.2c.42-.49 1.12-.66 1.72-.4l3.5 1.5c.58.25.96.81.96 1.44v3.16c0 .92-.78 1.65-1.7 1.6C8.9 21.87 2.13 15.1 1.64 4.1a1.6 1.6 0 0 1 1.6-1.7z"/>
</defs></svg>

<script src="/shared.js"></script>
<script src="/call.js"></script>
</body>
</html>
